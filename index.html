<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>情報端末</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            background: linear-gradient(135deg, #16213e 0%, #0f0f23 70%, #0a0a0a 100%);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .pulse-animation {
            animation: pulse 2s ease-in-out infinite;
        }

        .slide-in {
            animation: slideIn 0.8s ease-out;
        }

        .glass-effect {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(8px);
        }

        .clock-face {
            background: radial-gradient(circle at center, #1f2937 0%, #111827 70%);
            box-shadow: 
                inset 0 0 50px rgba(0,0,0,0.8),
                0 0 30px rgba(0,0,0,0.3);
        }

        .tick-mark {
            background: linear-gradient(to bottom, #9ca3af 0%, #6b7280 100%);
            box-shadow: 0 0 1px rgba(255,255,255,0.1);
        }

        .hour-mark {
            background: linear-gradient(to bottom, #f97316 0%, #ea580c 100%);
            box-shadow: 0 0 2px rgba(249,115,22,0.3);
        }

        .weather-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.02) 100%);
            backdrop-filter: blur(15px);
        }

        /* @media (max-width: 768px) {
            .mobile-vertical {
                flex-direction: column;
            }
        } */
    </style>
</head>

<body class="text-white min-h-screen max-h-screen overflow-hidden">
    <div class="flex h-screen w-screen">
        <div class="w-1/2 flex flex-col p-6">
            <div class="h-full flex items-center justify-center relative">
                <div class="clock-face relative w-[24rem] h-[24rem] rounded-full flex items-center justify-center slide-in">
                    <div id="clock-ticks" class="absolute w-full h-full rounded-full">
                        </div>
                    
                    <div id="second-hand" class="absolute w-0.5 h-36 bg-red-500 rounded-full origin-bottom" style="top: 50%; left: 50%; transform: translate(-50%, -100%);"></div>
                    
                    <div id="digital-clock" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-8xl font-light px-4 py-2 rounded-xl z-20" style="backdrop-filter: blur(2px); font-size: 5.5rem;">00:00</div>
                </div>
            </div>
            
            <div class="h-24 flex flex-col items-center justify-end space-y-4 slide-in pb-6">
                <div class="text-center">
                    <div id="date-display" class="text-4xl font-light mb-3" style="font-size: 2rem; line-height: 1.2;"></div>
                    <div class="relative mx-auto w-72">
                        <div class="absolute -top-4 left-0 w-full h-6 opacity-25 blur-lg overflow-hidden" style="background: radial-gradient(ellipse 80% 200% at center bottom, rgba(255,255,255,0.7) 0%, rgba(255,255,255,0.3) 30%, transparent 50%);"></div>
                        <div class="w-full h-px" style="background: linear-gradient(to bottom, #6b7280 0%, #4b5563 100%);"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="w-1/2 flex flex-col p-6">
            <div class="h-1/4 mb-4">
                <div class="weather-card rounded-2xl p-6 h-full flex items-center justify-between slide-in">
                    <div class="flex items-center space-x-6">
                        <div id="weather-icon" class="text-7xl">⏳</div>
                        <div class="flex flex-col">
                            <span id="current-temp" class="text-5xl font-bold">--°C</span>
                            <span id="weather-desc" class="text-xl opacity-80">読み込み中</span>
                        </div>
                    </div>
                    <div class="flex flex-col items-end space-y-2">
                        <div class="flex items-center space-x-3">
                            <span class="text-sm opacity-70">最高</span>
                            <span id="high-temp" class="text-3xl text-red-400">--°C</span>
                        </div>
                        <div class="flex items-center space-x-3">
                            <span class="text-sm opacity-70">最低</span>
                            <span id="low-temp" class="text-3xl font-light text-blue-400">--°C</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="h-1/2 mb-4">
                <div class="weather-card rounded-2xl p-2 h-full slide-in">
                    <div class="h-full">
                        <canvas id="forecast-chart" class="w-full h-full"></canvas>
                    </div>
                </div>
            </div>
            
            <div class="h-1/4">
                <div class="weather-card rounded-2xl p-4 h-full slide-in">
                    <div id="weekly-forecast" class="flex justify-between items-center h-full">
                        <div class="text-center text-sm opacity-50">読み込み中...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 最終更新時刻表示 -->
    <div id="last-update" class="fixed bottom-4 right-4 text-xs opacity-50 bg-black bg-opacity-30 px-2 py-1 rounded">
        --:--:--
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // DOM要素の取得
            const digitalClock = document.getElementById('digital-clock');
            const dateDisplay = document.getElementById('date-display');
            const secondHand = document.getElementById('second-hand');
            const weatherIcon = document.getElementById('weather-icon');
            const currentTemp = document.getElementById('current-temp');
            const weatherDesc = document.getElementById('weather-desc');
            const highTemp = document.getElementById('high-temp');
            const lowTemp = document.getElementById('low-temp');
            const lastUpdate = document.getElementById('last-update');

            // 緯度・経度を設定（東大和市の場合）
            const lat = 35.7505;
            const lon = 139.4296;
            const apiUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset&hourly=temperature_2m,precipitation_probability&current=temperature_2m&timezone=Asia%2FTokyo`;
            
            // 時刻更新関数
            function updateTime() {
                const now = new Date();
                const hours = now.getHours();
                const minutes = now.getMinutes();
                const seconds = now.getSeconds();
                
                const hoursStr = String(hours).padStart(2, '0');
                const minutesStr = String(minutes).padStart(2, '0');

                // デジタル時計更新（24時間表示）
                digitalClock.textContent = `${hoursStr}:${minutesStr}`;

                // 日付表示更新
                const year = now.getFullYear();
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const day = String(now.getDate()).padStart(2, '0');
                const days = ['Sun.', 'Mon.', 'Tue.', 'Wed.', 'Thu.', 'Fri.', 'Sat.'];
                const dayName = days[now.getDay()];

                // 曜日の色を決定
                let dayColor = 'inherit';
                if (dayName === 'Sat.') {
                    dayColor = '#3b82f6'; // 青色
                } else if (dayName === 'Sun.') {
                    dayColor = '#dc2626'; // 赤色
                }
                
                dateDisplay.innerHTML = `${year}<span style="font-size: 0.6em;"> </span>/<span style="font-size: 0.6em;"> </span>${month}<span style="font-size: 0.6em;"> </span>/<span style="font-size: 0.6em;"> </span>${day}<span style="font-size: 0.4em;"> </span><span style="color: #f97316; font-weight: 100; vertical-align: middle; font-size: 0.9em;">│</span><span style="font-size: 0.4em;"> </span><span style="color: ${dayColor};">${dayName}</span>`;

                // 秒針の回転（秒のみ）
                const secondDegrees = (seconds / 60) * 360;
                secondHand.style.transform = `translate(-50%, -100%) rotate(${secondDegrees}deg)`;
            }

            // 最終更新時刻を更新する関数
            function updateLastUpdateTime() {
                const now = new Date();
                const timeString = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
                lastUpdate.textContent = timeString;
            }

            // 天気情報取得関数（Open-Meteo用）
            async function updateWeatherData() {
                // 更新中の表示
                lastUpdate.textContent = 'Fetching...';
                
                try {
                    const response = await fetch(apiUrl);
                    if (!response.ok) {
                        throw new Error(`天気データの取得に失敗しました: ${response.status}`);
                    }
                    const data = await response.json();

                    // データのログ出力（デバッグ用）
                    console.log('Open-Meteo データ:', data);

                    // 天気コードからアイコンへのマッピング（WMO Weather interpretation codes）
                    function getWeatherIcon(weatherCode) {
                        if (weatherCode >= 0 && weatherCode <= 3) return '☀️'; // 晴れ、一部曇り
                        if (weatherCode >= 45 && weatherCode <= 48) return '🌫️'; // 霧、靄
                        if (weatherCode >= 51 && weatherCode <= 57) return '🌧️'; // 霧雨
                        if (weatherCode >= 61 && weatherCode <= 67) return '🌧️'; // 雨
                        if (weatherCode >= 71 && weatherCode <= 77) return '🌨️'; // 雪
                        if (weatherCode >= 80 && weatherCode <= 82) return '🌧️'; // にわか雨
                        if (weatherCode >= 85 && weatherCode <= 86) return '🌨️'; // にわか雪
                        if (weatherCode >= 95 && weatherCode <= 99) return '🌩️'; // 雷雨
                        return '❓';
                    }

                    // 天気コードから天気名へのマッピング（簡易版）
                    function getWeatherDescription(weatherCode) {
                        if (weatherCode === 0) return '快晴';
                        if (weatherCode === 1 || weatherCode === 2 || weatherCode === 3) return '晴れ';
                        if (weatherCode === 45 || weatherCode === 48) return '霧';
                        if (weatherCode === 51 || weatherCode === 53 || weatherCode === 55) return '霧雨';
                        if (weatherCode === 56 || weatherCode === 57) return '凍雨';
                        if (weatherCode === 61 || weatherCode === 63 || weatherCode === 65) return '雨';
                        if (weatherCode === 66 || weatherCode === 67) return '凍雨';
                        if (weatherCode === 71 || weatherCode === 73 || weatherCode === 75) return '雪';
                        if (weatherCode === 77) return '雪片';
                        if (weatherCode === 80 || weatherCode === 81 || weatherCode || weatherCode === 82) return 'にわか雨';
                        if (weatherCode === 85 || weatherCode === 86) return 'にわか雪';
                        if (weatherCode === 95) return '雷雨';
                        if (weatherCode === 96 || weatherCode === 99) return '雷雨（雹を伴う）';
                        return '不明';
                    }

                    const currentTemp = data.current.temperature_2m;
                    const weatherCode = data.daily.weather_code[0];
                    const highTemp = data.daily.temperature_2m_max[0];
                    const lowTemp = data.daily.temperature_2m_min[0];

                    // データをHTML要素に反映
                    document.getElementById('current-temp').textContent = `${Math.round(currentTemp)}°C`;
                    document.getElementById('weather-desc').textContent = getWeatherDescription(weatherCode);
                    document.getElementById('weather-icon').textContent = getWeatherIcon(weatherCode);
                    document.getElementById('high-temp').textContent = `${Math.round(highTemp)}°C`;
                    document.getElementById('low-temp').textContent = `${Math.round(lowTemp)}°C`;

                    // 最終更新時刻を更新
                    updateLastUpdateTime();

                } catch (error) {
                    console.error('天気データの取得に失敗しました:', error);
                    document.getElementById('weather-icon').textContent = '❌';
                    document.getElementById('weather-desc').textContent = '取得失敗';
                    document.getElementById('current-temp').textContent = '--°C';
                    document.getElementById('high-temp').textContent = '--°C';
                    document.getElementById('low-temp').textContent = '--°C';
                }
            }

            // 7日間天気予報表示関数
            async function updateWeeklyForecast() {
                try {
                    const response = await fetch(apiUrl);
                    if (!response.ok) {
                        throw new Error(`週間予報データの取得に失敗しました: ${response.status}`);
                    }
                    const data = await response.json();

                    const dailyData = data.daily;
                    const weeklyContainer = document.getElementById('weekly-forecast');
                    weeklyContainer.innerHTML = '';

                    // 天気コードからアイコンへのマッピング
                    function getWeatherIcon(weatherCode) {
                        if (weatherCode >= 0 && weatherCode <= 3) return '☀️'; // 晴れ、一部曇り
                        if (weatherCode >= 45 && weatherCode <= 48) return '☁️'; // 霧、靄
                        if (weatherCode >= 51 && weatherCode <= 57) return '🌧️'; // 霧雨
                        if (weatherCode >= 61 && weatherCode <= 67) return '🌧️'; // 雨
                        if (weatherCode >= 71 && weatherCode <= 77) return '🌨️'; // 雪
                        if (weatherCode >= 80 && weatherCode <= 82) return '🌧️'; // にわか雨
                        if (weatherCode >= 85 && weatherCode <= 86) return '🌨️'; // にわか雪
                        if (weatherCode >= 95 && weatherCode <= 99) return '🌩️'; // 雷雨
                        return '❓';
                    }

                    for (let i = 0; i < 7; i++) {
                        const date = new Date(dailyData.time[i]);
                        const dayName = ['日', '月', '火', '水', '木', '金', '土'][date.getDay()];
                        const weatherCode = dailyData.weather_code[i];
                        const maxTemp = Math.round(dailyData.temperature_2m_max[i]);
                        const minTemp = Math.round(dailyData.temperature_2m_min[i]);

                        const dayElement = document.createElement('div');
                        dayElement.className = 'flex flex-col items-center justify-center text-center space-y-1';
                        
                        dayElement.innerHTML = `
                            <div class="text-base opacity-70">${i === 0 ? '今日' : dayName}</div>
                            <div class="text-2xl">${getWeatherIcon(weatherCode)}</div>
                            <div class="text-base">
                                <span class="text-red-300">${maxTemp}</span><span class="opacity-50">/</span><span class="text-blue-300">${minTemp}</span>
                            </div>
                        `;

                        weeklyContainer.appendChild(dayElement);
                    }

                } catch (error) {
                    console.error('週間予報データの取得に失敗しました:', error);
                    document.getElementById('weekly-forecast').innerHTML = '<div class="text-center text-sm opacity-70">予報取得失敗</div>';
                }
            }

            // 24時間予報グラフ作成関数（Open-Meteo用）
            async function createForecastChart() {
                try {
                    const response = await fetch(apiUrl);
                    if (!response.ok) {
                        throw new Error(`予報データの取得に失敗しました: ${response.status}`);
                    }
                    const data = await response.json();

                    // データのログ出力（デバッグ用）
                    console.log('Open-Meteo 予報データ:', data);

                    const nowHour = new Date().getHours();
                    const hourlyData = data.hourly;
                    const labels = [];
                    const temps = [];
                    const precipitationProb = [];
                    
                    // 現在時刻から24時間分のデータを抽出
                    const startIndex = hourlyData.time.findIndex(t => new Date(t).getHours() === nowHour);
                    if (startIndex === -1) {
                        throw new Error('予報データの開始時刻が見つかりません');
                    }
                    
                    for (let i = 0; i < 24; i++) {
                        const index = startIndex + i;
                        if (index >= hourlyData.time.length) break;
                        
                        const date = new Date(hourlyData.time[index]);
                        labels.push(`${String(date.getHours()).padStart(2, '0')}:00`);
                        temps.push(hourlyData.temperature_2m[index]);
                        // 降水確率を取得
                        const prob = hourlyData.precipitation_probability[index] || 0;
                        precipitationProb.push(prob);
                    }

                    // 日の出・日の入り時刻を取得
                    const dailyData = data.daily;
                    const today = new Date().toISOString().split('T')[0];
                    console.log('今日の日付:', today);
                    console.log('dailyData.time:', dailyData.time);
                    
                    // 今日または最も近い日付を見つける
                    let todayIndex = dailyData.time.findIndex(d => d === today);
                    if (todayIndex === -1) {
                        // 今日の日付が見つからない場合、最初の日付を使用
                        todayIndex = 0;
                        console.log('今日の日付が見つからないため、最初の日付を使用:', dailyData.time[0]);
                    }
                    
                    const sunrise = new Date(dailyData.sunrise[todayIndex]);
                    const sunset = new Date(dailyData.sunset[todayIndex]);
                    
                    console.log('todayIndex:', todayIndex);
                    console.log('sunrise:', sunrise);
                    console.log('sunset:', sunset);
                    
                    // 日の出・日の入りのインデックスを計算
                    let sunriseIndex = -1, sunsetIndex = -1;
                    if (sunrise) {
                        for (let i = 0; i < labels.length; i++) {
                            const hour = parseInt(labels[i].split(':')[0]);
                            if (hour === sunrise.getHours()) {
                                sunriseIndex = i;
                                break;
                            }
                        }
                    }
                    if (sunset) {
                        for (let i = 0; i < labels.length; i++) {
                            const hour = parseInt(labels[i].split(':')[0]);
                            if (hour === sunset.getHours()) {
                                sunsetIndex = i;
                                break;
                            }
                        }
                    }
                    
                    console.log('sunriseIndex:', sunriseIndex);
                    console.log('sunsetIndex:', sunsetIndex);
                    console.log('labels:', labels);
                    
                    const ctx = document.getElementById('forecast-chart').getContext('2d');
                    
                    // 既存のChart.jsインスタンスがあれば破棄
                    if (window.myChart) {
                        window.myChart.destroy();
                    }

                    // 日の出・日の入りを描画するプラグイン
                    const sunriseSunsetPlugin = {
                        id: 'sunriseSunset',
                        beforeDraw: function(chart, args, options) {
                            const ctx = chart.ctx;
                            const chartArea = chart.chartArea;
                            const xScale = chart.scales.x;
                            
                            ctx.save();
                            
                            // 日中の時間帯をハイライト（より薄い色で背景に）
                            if (options.sunriseIndex >= 0 && options.sunsetIndex >= 0) {
                                const sunriseX = xScale.getPixelForValue(options.sunriseIndex);
                                const sunsetX = xScale.getPixelForValue(options.sunsetIndex);
                                
                                // 日中のハイライト背景（さらに薄く）
                                ctx.fillStyle = 'rgba(255, 248, 220, 0.08)';
                                ctx.fillRect(sunriseX, chartArea.top, sunsetX - sunriseX, chartArea.bottom - chartArea.top);
                            }
                            
                            ctx.restore();
                        }
                    };
                    
                    // プラグインを登録
                    Chart.register(sunriseSunsetPlugin);
                    
                    const tempGradient = ctx.createLinearGradient(0, 0, 0, 200);
                    tempGradient.addColorStop(0, 'rgba(249, 115, 22, 0.3)');
                    tempGradient.addColorStop(1, 'rgba(249, 115, 22, 0.05)');

                    const rainGradient = ctx.createLinearGradient(0, 0, 0, 200);
                    rainGradient.addColorStop(0, 'rgba(59, 130, 246, 0.25)');
                    rainGradient.addColorStop(1, 'rgba(59, 130, 246, 0.05)');

                    window.myChart = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: labels,
                            datasets: [{
                                label: '気温 (°C)',
                                data: temps,
                                backgroundColor: 'rgba(249, 115, 22, 0.05)',
                                borderColor: 'rgba(249, 115, 22, 1)',
                                borderWidth: 2,
                                pointRadius: 0,
                                fill: true,
                                tension: 0.4,
                                yAxisID: 'y'
                            }, {
                                label: '降水確率 (%)',
                                data: precipitationProb,
                                backgroundColor: 'rgba(59, 130, 246, 0.05)',
                                borderColor: 'rgba(59, 130, 246, 1)',
                                borderWidth: 2,
                                pointRadius: 0,
                                fill: true,
                                tension: 0.4,
                                yAxisID: 'y1'
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            layout: {
                                padding: {
                                    bottom: 0
                                }
                            },
                            scales: {
                                x: {
                                    ticks: { 
                                        color: 'rgba(255, 255, 255, 0.8)',
                                        maxTicksLimit: 8,
                                        font: { size: 15 },
                                        maxRotation: 0,
                                        autoSkip: true,
                                        padding: 0,
                                        callback: function(value, index, values) {
                                            const label = this.getLabelForValue(value);
                                            if (!label) return '';
                                            return label.split(':')[0];
                                        }
                                    },
                                    grid: { 
                                        color: 'rgba(255, 255, 255, 0.1)',
                                        offset: false
                                    }
                                },
                                y: {
                                    type: 'linear',
                                    display: true,
                                    position: 'left',
                                    ticks: { 
                                        color: 'rgba(249, 115, 22, 0.8)',
                                        font: { size: 15 },
                                        maxRotation: 0,
                                        callback: function(value) { return value + '°C'; }
                                    },
                                    grid: { color: 'rgba(255, 255, 255, 0.1)' },
                                    title: {
                                        display: false
                                    }
                                },
                                y1: {
                                    type: 'linear',
                                    display: true,
                                    position: 'left',
                                    min: 0,
                                    max: 100,
                                    ticks: { 
                                        color: 'rgba(59, 130, 246, 0.8)',
                                        font: { size: 15 },
                                        stepSize: 20,
                                        maxRotation: 0,
                                        callback: function(value) { return value + '%'; }
                                    },
                                    grid: { drawOnChartArea: false },
                                    offset: false,
                                    title: {
                                        display: false
                                    }
                                }
                            },
                            plugins: {
                                legend: { display: false },
                                tooltip: {
                                    callbacks: {
                                        label: function(context) {
                                            let label = context.dataset.label || '';
                                            if (label) {
                                                label += ': ';
                                            }
                                            if (context.parsed.y !== null) {
                                                label += `${Math.round(context.parsed.y)}°C`;
                                            }
                                            return label;
                                        }
                                    }
                                },
                                sunriseSunset: {
                                    sunriseIndex: sunriseIndex,
                                    sunsetIndex: sunsetIndex
                                }
                            }
                        }
                    });

                } catch (error) {
                    console.error('予報グラフの作成に失敗しました:', error);
                    const ctx = document.getElementById('forecast-chart').getContext('2d');
                    ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
                    ctx.fillStyle = 'white';
                    ctx.font = '18px Inter';
                    ctx.textAlign = 'center';
                    ctx.fillText('予報データ取得失敗', ctx.canvas.width / 2, ctx.canvas.height / 2);
                }
            }
            
            // 時計の目盛り生成（修正版）
            function createClockTicks() {
                const ticksContainer = document.getElementById('clock-ticks');
                const clockSize = ticksContainer.offsetWidth; 
                const radius = clockSize / 2;
                
                for (let i = 0; i < 12; i++) { // 12個の目盛りを生成 (5分ごと)
                    const isQuarterHour = i % 3 === 0; // 0, 3, 6, 9番目の目盛り
                    
                    const tick = document.createElement('div');
                    tick.className = `absolute rounded-full tick-mark ${isQuarterHour ? 'hour-mark' : ''}`;
                    
                    if (isQuarterHour) {
                        tick.style.width = '2px';
                        tick.style.height = '18px';
                    } else {
                        tick.style.width = '1px';
                        tick.style.height = '10px';
                        tick.style.background = 'linear-gradient(to bottom, #9ca3af 0%, #6b7280 100%)'; // グレー
                        tick.style.opacity = '0.7';
                    }

                    // 目盛りを時計の中心に配置
                    tick.style.top = '50%';
                    tick.style.left = '50%';
                    // translateで中心から外側に移動させてから、回転させる
                    tick.style.transform = `translate(-50%, -${radius - 15}px) rotate(${i * 30}deg)`;
                    tick.style.transformOrigin = `center ${radius - 15}px`;
                    
                    ticksContainer.appendChild(tick);
                }
            }

            // 祝日判定関数（簡易版）
            function isHoliday(date) {
                const year = date.getFullYear();
                const month = date.getMonth() + 1;
                const day = date.getDate();
                
                // 主要な固定祝日のみ実装
                const fixedHolidays = [
                    '1/1',   // 元日
                    '2/11',  // 建国記念の日
                    '4/29',  // 昭和の日
                    '5/3',   // 憲法記念日
                    '5/4',   // みどりの日
                    '5/5',   // こどもの日
                    '8/11',  // 山の日
                    '11/3',  // 文化の日
                    '11/23', // 勤労感謝の日
                    '12/23'  // 天皇誕生日
                ];
                
                return fixedHolidays.includes(`${month}/${day}`);
            }

            // 初期化とタイマー設定
            createClockTicks();
            updateTime();
            updateWeatherData();
            createForecastChart();
            updateWeeklyForecast();
            
            setInterval(updateTime, 1000);
            setInterval(updateWeatherData, 20000); // 20秒毎に更新
            setInterval(createForecastChart, 20000); // 20秒毎に更新
            setInterval(updateWeeklyForecast, 20000); // 20秒毎に更新

            // アニメーション遅延設定
            setTimeout(() => {
                document.querySelectorAll('.slide-in').forEach((el, index) => {
                    el.style.animationDelay = `${index * 0.2}s`;
                });
            }, 100);
        });
    </script>
</body>

</html>
